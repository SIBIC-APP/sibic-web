<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIBIC</title>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #09090b;
      color: #fafafa;
      text-align: center;
      padding: 1.5rem;
    }
    .container {
      max-width: 380px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 1.5rem auto;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #3b82f6;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; font-weight: 700; }
    p { font-size: 0.95rem; color: #a1a1aa; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Iniciando SIBIC</h1>
    <p>Conectando con la plataforma...</p>
  </div>
</body>
</html>
